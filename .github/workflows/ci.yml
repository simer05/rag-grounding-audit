name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "pandas>=2.0" "pyarrow>=14" "scipy>=1.11" pytest
      - run: pytest -q
